# ==============================================================================
# STOLAŘSTVÍ PODOBA — PRODUKČNÍ KONFIGURACE NGINX
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name stolarstvipodoba.cz www.stolarstvipodoba.cz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stolarstvipodoba.cz www.stolarstvipodoba.cz;

    root /var/www/stolarstvipodoba;
    index index.html;

    # SSL konfigurace (cesta k certifikátům dle hostingu)
    # ssl_certificate /etc/letsencrypt/live/stolarstvipodoba.cz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/stolarstvipodoba.cz/privkey.pem;

    # BEZPEČNOSTNÍ HLAVIČKY
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Zákaz skrytých souborů
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Statické zdroje a cache
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|webp|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:css|js)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
